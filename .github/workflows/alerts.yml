name: High Impact Alerts

on:
  schedule:
    # Každých 10 minut (v :02, :12, :22 ...). Bot upozorní na High Impact zprávu,
    # když do ní zbývá 20 minut nebo méně. Zpožděný běh dožene ten další.
    - cron: "2-59/10 * * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "RRRR-MM-DDTHH:MM"
        required: false
        type: string

permissions:
  contents: write   # bot si do repozitáře ukládá, o kterých zprávách už upozornil

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send alerts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          CURRENCIES: ${{ vars.CURRENCIES }}
          ALERT_IMPACT: ${{ vars.ALERT_IMPACT }}
          ALERT_WINDOW_MIN: ${{ vars.ALERT_WINDOW_MIN }}
          ALERT_PING: ${{ vars.ALERT_PING }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          BOT_NOW: ${{ inputs.now }}
        run: python bot.py --mode alert
      - name: Save alert state
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "forex-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "Update alert state"
            git push
          fi
